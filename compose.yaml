services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file: .env
    environment:
      WORKER_APP_URL: http://app:3000
    command: ['node', 'scripts/worker.mjs']
    depends_on:
      - app
    restart: unless-stopped
